name: vocabmaster

# VocabMaster — 生产部署配置（2C2G 优化）
# 用法：
#   docker compose up -d                          # 起所有服务
#   docker compose up -d mysql redis              # 只起中间件（开发调试）
#   docker compose logs -f backend-java           # 查日志
#   docker compose down                           # 停止
#   docker compose down -v                        # 停止并删除数据卷（慎用）

services:
  # ═══════════════════ MySQL ═══════════════════
  mysql:
    image: mysql:8.0.39
    container_name: vocab-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-vocabmaster}
      MYSQL_USER: ${DB_USERNAME:-vocab}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vocab123}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # ── 2C2G 优化 ──
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --skip-log-bin                    # 关闭 binlog，省内存和磁盘 IO
      - --innodb-flush-log-at-trx-commit=2

      - --slow-query-log=ON
      - --long-query-time=2
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME:-vocab}", "-p${DB_PASSWORD:-vocab123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 400M
    networks:
      - vocab-net

  # ═══════════════════ Redis ═══════════════════
  redis:
    image: redis:7-alpine
    container_name: vocab-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass "${REDIS_PASSWORD:-redis123}"
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 180M
    networks:
      - vocab-net

  # ═══════════════════ Spring Boot 后端 ═══════════════════
  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: vocab-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vocabmaster}
      DB_USERNAME: ${DB_USERNAME:-vocab}
      DB_PASSWORD: ${DB_PASSWORD:-vocab123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      AES_KEY: ${AES_KEY:-ZGV2LWFlcy1rZXktMzJieXRlcy1sb25n}
      # ── 微信小程序 ──
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      # ── JVM 优化 ──
      JAVA_OPTS: -Xmx384m -Xms256m -XX:+UseSerialGC -XX:+UseCompressedOops -XX:MaxMetaspaceSize=128m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 500M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - vocab-net

  # ═══════════════════ Nginx 反代（仅生产） ═══════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: vocab-nginx
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./wordmate-web/dist:/usr/share/nginx/html:ro          # 前端静态文件
      - nginx_logs:/var/log/nginx
      - ./deploy/certbot/webroot:/var/www/certbot:ro          # Let's Encrypt 验证
    depends_on:
      backend-java:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - vocab-net

  # ═══════════════════ 前端（本地开发） ═══════════════════
  wordmate-web:
    image: nginx:1.27-alpine
    container_name: vocab-wordmate-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      - ./wordmate-web/dist:/usr/share/nginx/html:ro
      - ./wordmate-web/deploy/web-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vocab-net

  # ═══════════════════ Certbot (可选，自动续签 SSL) ═══════════════════
  certbot:
    image: certbot/certbot:latest
    container_name: vocab-certbot
    profiles: ["ssl"]
    volumes:
      - ./deploy/nginx/ssl:/etc/letsencrypt
      - ./deploy/certbot/webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  vocab-net:
    name: vocab-net
