<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a4dff"/>
      <stop offset="0.55" stop-color="#863bff"/>
      <stop offset="1" stop-color="#5a1fb0"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background rounded square (WeChat masks further) -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- soft glow blob, top-right accent -->
  <circle cx="780" cy="250" r="210" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>

  <!-- Ebbinghaus memory-recovery staircase: each review lifts retention higher -->
  <g stroke="url(#curve)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="
      196 642
      196 470
      372 470
      372 560
      548 560
      548 430
      724 430
      724 510
      828 510
      828 398"/>
    <!-- rising trend arrowhead -->
    <polyline points="788 426 828 398 808 442"/>
  </g>

  <!-- WordMate "W" monogram -->
  <text x="512" y="560"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="440" font-weight="800"
        text-anchor="middle" dominant-baseline="alphabetic"
        fill="#ffffff" letter-spacing="-18">W</text>
</svg>
