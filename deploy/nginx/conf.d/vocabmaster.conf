# ══════════════════════════════════════════════════════════
# VocabMaster — 生产站点配置
# HTTP(IP 兜底) + HTTPS(域名 vocab-master.cn) + 80→443 跳转
# 证书：阿里云 DV（deploy/nginx/ssl/），手动续签
# ══════════════════════════════════════════════════════════

upstream backend {
    server backend-java:8080;
    keepalive 32;
}

# ── HTTP → HTTPS 重定向（命中域名 vocab-master.cn 跳 443）──
server {
    listen 80;
    server_name vocab-master.cn www.vocab-master.cn;

    # Let's Encrypt 验证留个口子（将来切 certbot 用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://$host$request_uri;
}

# ── HTTPS 主站 ───────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name vocab-master.cn www.vocab-master.cn;

    ssl_certificate     /etc/nginx/ssl/vocab-master.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/vocab-master.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # ── API 反代 ──
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ── Swagger / API 文档（生产可删）──
    location /swagger-ui/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /v3/api-docs {
        proxy_pass http://backend;
    }

    # ── Actuator 健康检查 ──
    location /api/v1/actuator/ {
        proxy_pass http://backend;
    }

    # ── 静态示意图 ──
    location /images/ {
        alias /usr/share/nginx/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA 路由 ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 静态资源长缓存 ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Let's Encrypt 验证（将来切 certbot 用）──
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ── HTTP IP 直连兜底（无域名访问，如健康巡检/管理员）──
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/actuator/ {
        proxy_pass http://backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
